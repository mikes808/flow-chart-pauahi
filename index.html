<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowchart Template with Durations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one centered vertical flow; a timeline gutter on the left shows when each step starts. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5d6b7a;
  --line: #c9d2db;
  --accent: #1f6feb;
  --start: #1a7f5a;
  --decision: #b7791f;
  --wait: #7c5cc4;
  --end: #b42318;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #18202a; --ink: #e6ebf0; --muted: #93a1b0; --line: #2f3b48;
    --accent: #5b9dff; --start: #3fb98a; --decision: #e0a542; --wait: #a68bf0; --end: #f0706a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #18202a; --ink: #e6ebf0; --muted: #93a1b0; --line: #2f3b48;
  --accent: #5b9dff; --start: #3fb98a; --decision: #e0a542; --wait: #a68bf0; --end: #f0706a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.title-block { display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px; }
#chartTitle { font-size: 26px; font-weight: 600; border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; margin-left: -7px; background: transparent; color: var(--ink); font-family: inherit; width: 100%; }
#chartTitle:hover { border-color: var(--line); }
#chartTitle:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }

.summary { display: flex; gap: 10px; flex-wrap: wrap; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-width: 110px; }
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile .v { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select, input { font-family: inherit; font-size: 14px; color: var(--ink); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.toolbar .spacer { flex: 1; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.toast.err { color: var(--end); }
.btn:disabled { opacity: .6; cursor: progress; }
.toast { font-size: 13px; color: var(--start); min-height: 1em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Flow */
.flow { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 84px 1fr; gap: 12px; }
.when { text-align: right; padding-top: 16px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.when b { display: block; color: var(--ink); font-weight: 500; font-size: 13px; }

.node { --c: var(--accent); position: relative; background: var(--surface); border: 1.5px solid var(--c); border-left-width: 6px; border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; }
.node[data-type="start"], .node[data-type="end"] { border-radius: 999px; border-left-width: 1.5px; padding-left: 22px; padding-right: 18px; }
.node[data-type="start"] { --c: var(--start); }
.node[data-type="end"] { --c: var(--end); }
.node[data-type="decision"] { --c: var(--decision); border-style: solid; border-left-width: 1.5px; clip-path: none; background:
  linear-gradient(var(--surface), var(--surface)) padding-box; }
.node[data-type="decision"]::before { content: ""; position: absolute; left: -9px; top: 50%; width: 16px; height: 16px; background: var(--c); transform: translateY(-50%) rotate(45deg); border-radius: 2px; }
.node[data-type="wait"] { --c: var(--wait); border-style: dashed; border-left-style: solid; }

.main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.typeline { display: flex; align-items: center; gap: 8px; }
.typeSel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--c); background: transparent; border: none; padding: 0; cursor: pointer; font-weight: 600; }
.stepno { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.field { border: 1px solid transparent; border-radius: 4px; background: transparent; padding: 2px 4px; margin-left: -5px; width: 100%; font-family: inherit; color: var(--ink); resize: none; }
.field:hover { border-color: var(--line); }
.field:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.name { font-size: 16px; font-weight: 600; }
.desc { font-size: 13px; color: var(--muted); min-height: 1.6em; overflow: hidden; }
.desc:focus { color: var(--ink); }

.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.dur { display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px 3px 8px; }
.dur label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
.dur input { width: 56px; border: none; background: transparent; font-family: var(--font-mono); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; padding: 2px; }
.dur input:focus { outline: none; }
.dur:focus-within { border-color: var(--accent); }
.dur select { border: none; background: transparent; font-size: 13px; cursor: pointer; }
.actions { display: flex; gap: 2px; }
.icon { width: 28px; height: 26px; border: 1px solid transparent; background: transparent; border-radius: 5px; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; }
.icon:hover { border-color: var(--line); color: var(--ink); }
.icon.del:hover { color: var(--end); border-color: var(--end); }

.branch { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.branch span { display: inline-flex; align-items: center; gap: 6px; }
.branch input, .branch select { font-size: 13px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 2px 6px; }
.branch input { width: 70px; }

.connector { display: grid; grid-template-columns: 84px 1fr; gap: 12px; height: 38px; }
.connector .stem { position: relative; }
.connector .stem::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 8px; width: 2px; background: var(--line); transform: translateX(-50%); }
.connector .stem::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--line); transform: translateX(-50%); }
.connector .add { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -60%); width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; opacity: .55; z-index: 1; }
.connector:hover .add, .connector .add:focus-visible { opacity: 1; border-color: var(--accent); color: var(--accent); }
.connector .yes { position: absolute; left: calc(50% + 10px); top: 6px; font-size: 11px; color: var(--decision); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

.dialog-back { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.dialog-back.open { display: flex; }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.dialog p { margin: 0; }
.dialog .btns { display: flex; justify-content: flex-end; gap: 8px; }

@media (max-width: 560px) {
  .row, .connector { grid-template-columns: 56px 1fr; gap: 8px; }
  .node { grid-template-columns: 1fr; }
  .side { flex-direction: row; justify-content: space-between; align-items: center; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <input id="chartTitle" aria-label="Flowchart title" value="New Customer Onboarding">
      <p class="hint">Click any text to edit it. Set a duration on each step; totals and start times update as you type. Use + between steps to insert one.</p>
    </div>
    <div class="summary">
      <div class="tile"><div class="k">Total time</div><div class="v" id="totTime">0m</div></div>
      <div class="tile"><div class="k">Steps</div><div class="v" id="totSteps">0</div></div>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn" id="addEnd" type="button">+ Add step</button>
    <button class="btn primary" id="exportPdf" type="button">Export fillable PDF</button>
    <label class="chk"><input type="checkbox" id="blankSlots" checked> Add 3 blank steps to the PDF</label>
    <button class="btn" id="copyText" type="button">Copy as text</button>
    <button class="btn" id="resetBtn" type="button">Reset template</button>
    <span class="toast" id="toast" role="status"></span>
    <span class="spacer"></span>
    <div class="legend" aria-label="Shape legend">
      <span><i style="background:var(--start)"></i>Start</span>
      <span><i style="background:var(--accent)"></i>Step</span>
      <span><i style="background:var(--decision)"></i>Decision</span>
      <span><i style="background:var(--wait)"></i>Wait</span>
      <span><i style="background:var(--end)"></i>End</span>
    </div>
  </div>

  <main class="flow" id="flow" aria-label="Flowchart steps"></main>
</div>

<div class="dialog-back" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgText">
  <div class="dialog">
    <p id="dlgText">Replace this flowchart with the blank template? Your edits will be lost.</p>
    <div class="btns">
      <button class="btn" id="dlgNo" type="button">Cancel</button>
      <button class="btn primary" id="dlgYes" type="button">Reset</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function () {
  const TYPES = { start: "Start", step: "Step", decision: "Decision", wait: "Wait", end: "End" };
  const UNITS = { min: 1, hr: 60, day: 480, wk: 2400 }; // day = 8 working hours, week = 5 days
  const UNIT_LABEL = { min: "min", hr: "hr", day: "day", wk: "wk" };
  let uid = 1;
  const mk = (type, name, desc, dur, unit, extra) => Object.assign({ id: uid++, type, name, desc, dur, unit }, extra || {});

  const template = () => [
    mk("start", "Signed contract received", "Sales hands off to onboarding", 0, "min"),
    mk("step", "Send welcome email", "Include login link and kickoff scheduler", 15, "min"),
    mk("step", "Kickoff call", "Confirm goals, contacts and timeline", 1, "hr"),
    mk("decision", "Data import needed?", "", 10, "min", { yes: "Yes", no: "No", noTarget: null }),
    mk("step", "Import customer data", "Map fields, run test import, verify", 4, "hr"),
    mk("wait", "Customer review", "Customer checks imported records", 2, "day"),
    mk("step", "Training session", "Walk through core workflows", 90, "min"),
    mk("end", "Account live", "Hand off to account manager", 0, "min")
  ];

  let state;
  const KEY = "flowchart-template-v1";
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.steps)) { uid = Math.max(0, ...s.steps.map(x => x.id)) + 1; return s; }
    } catch (e) {}
    const steps = template();
    steps[3].noTarget = steps[6].id;
    return { title: "New Customer Onboarding", steps };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const minutes = s => (parseFloat(s.dur) || 0) * (UNITS[s.unit] || 1);
  function fmt(m) {
    m = Math.round(m);
    if (m === 0) return "0m";
    const d = Math.floor(m / 480), h = Math.floor((m % 480) / 60), mm = m % 60;
    return [d && d + "d", h && h + "h", mm && mm + "m"].filter(Boolean).join(" ");
  }

  const flow = document.getElementById("flow");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function render() {
    document.getElementById("chartTitle").value = state.title;
    let html = "", t = 0;
    state.steps.forEach((s, i) => {
      const opts = Object.keys(TYPES).map(k => `<option value="${k}"${k === s.type ? " selected" : ""}>${TYPES[k]}</option>`).join("");
      const units = Object.keys(UNITS).map(k => `<option value="${k}"${k === s.unit ? " selected" : ""}>${UNIT_LABEL[k]}</option>`).join("");
      let branch = "";
      if (s.type === "decision") {
        const targets = state.steps.map((x, j) => j === i ? "" : `<option value="${x.id}"${x.id === s.noTarget ? " selected" : ""}>${j + 1}. ${esc(x.name || "Untitled")}</option>`).join("");
        branch = `<div class="branch">
          <span><label for="yes${s.id}">Down arrow label</label><input id="yes${s.id}" data-f="yes" value="${esc(s.yes || "Yes")}"></span>
          <span><input id="no${s.id}" data-f="no" aria-label="Other branch label" value="${esc(s.no || "No")}"><label for="nt${s.id}">goes to</label>
          <select id="nt${s.id}" data-f="noTarget"><option value="">(choose step)</option>${targets}</select></span>
        </div>`;
      }
      html += `<div class="row">
        <div class="when"><b>+${fmt(t)}</b>${i === 0 ? "start" : "starts"}</div>
        <section class="node" data-type="${s.type}" data-id="${s.id}" aria-label="Step ${i + 1}">
          <div class="main">
            <div class="typeline"><span class="stepno">${String(i + 1).padStart(2, "0")}</span>
              <select class="typeSel" data-f="type" aria-label="Shape type for step ${i + 1}">${opts}</select></div>
            <input class="field name" data-f="name" id="n${s.id}" aria-label="Step ${i + 1} name" value="${esc(s.name)}" placeholder="Step name">
            <textarea class="field desc" data-f="desc" id="d${s.id}" rows="1" aria-label="Step ${i + 1} notes" placeholder="Add notes (optional)">${esc(s.desc)}</textarea>
          </div>
          <div class="side">
            <div class="dur"><label for="du${s.id}">Time</label>
              <input id="du${s.id}" data-f="dur" type="number" min="0" step="any" inputmode="decimal" value="${esc(s.dur)}">
              <select id="un${s.id}" data-f="unit" aria-label="Duration unit">${units}</select></div>
            <div class="actions">
              <button class="icon" data-a="up" type="button" title="Move up" aria-label="Move step ${i + 1} up">↑</button>
              <button class="icon" data-a="down" type="button" title="Move down" aria-label="Move step ${i + 1} down">↓</button>
              <button class="icon" data-a="dup" type="button" title="Duplicate" aria-label="Duplicate step ${i + 1}">⧉</button>
              <button class="icon del" data-a="del" type="button" title="Delete" aria-label="Delete step ${i + 1}">✕</button>
            </div>
          </div>
          ${branch}
        </section>
      </div>`;
      t += minutes(s);
      if (i < state.steps.length - 1) {
        html += `<div class="connector"><div></div><div class="stem">
          ${s.type === "decision" ? `<span class="yes">${esc(s.yes || "Yes")}</span>` : ""}
          <button class="add" data-a="ins" data-after="${s.id}" type="button" title="Insert step here" aria-label="Insert step after step ${i + 1}">+</button></div></div>`;
      }
    });
    flow.innerHTML = html;
    flow.querySelectorAll("textarea").forEach(autosize);
    totals();
  }

  function totals() {
    document.getElementById("totTime").textContent = fmt(state.steps.reduce((a, s) => a + minutes(s), 0));
    document.getElementById("totSteps").textContent = state.steps.length;
    let t = 0;
    flow.querySelectorAll(".when b").forEach((b, i) => { b.textContent = "+" + fmt(t); t += minutes(state.steps[i]); });
  }
  function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
  const find = id => state.steps.findIndex(s => s.id === id);

  flow.addEventListener("input", e => {
    const f = e.target.dataset.f, node = e.target.closest(".node");
    if (!f || !node) return;
    const s = state.steps[find(+node.dataset.id)];
    if (f === "type" || f === "unit" || f === "noTarget") return;
    s[f] = e.target.value;
    if (e.target.tagName === "TEXTAREA") autosize(e.target);
    if (f === "dur") totals();
    if (f === "name") { const n = find(s.id) + 1; flow.querySelectorAll(`select[data-f="noTarget"] option[value="${s.id}"]`).forEach(o => o.textContent = `${n}. ${s.name || "Untitled"}`); }
    if (f === "yes") { const y = node.parentElement.nextElementSibling; const l = y && y.querySelector(".yes"); if (l) l.textContent = s.yes; }
    save();
  });
  flow.addEventListener("change", e => {
    const f = e.target.dataset.f, node = e.target.closest(".node");
    if (!f || !node) return;
    const s = state.steps[find(+node.dataset.id)];
    if (f === "type") { s.type = e.target.value; if (s.type === "decision" && !s.yes) { s.yes = "Yes"; s.no = "No"; s.noTarget = null; } save(); render(); focusSel(s.id, "type"); }
    else if (f === "unit") { s.unit = e.target.value; totals(); save(); }
    else if (f === "noTarget") { s.noTarget = e.target.value ? +e.target.value : null; save(); }
  });
  function focusSel(id, f) { const el = flow.querySelector(`.node[data-id="${id}"] [data-f="${f}"]`); if (el) el.focus(); }

  flow.addEventListener("click", e => {
    const b = e.target.closest("button[data-a]");
    if (!b) return;
    const a = b.dataset.a;
    if (a === "ins") { const i = find(+b.dataset.after); const n = mk("step", "", "", 30, "min"); state.steps.splice(i + 1, 0, n); save(); render(); focusSel(n.id, "name"); return; }
    const id = +b.closest(".node").dataset.id, i = find(id);
    if (a === "up" && i > 0) [state.steps[i - 1], state.steps[i]] = [state.steps[i], state.steps[i - 1]];
    else if (a === "down" && i < state.steps.length - 1) [state.steps[i + 1], state.steps[i]] = [state.steps[i], state.steps[i + 1]];
    else if (a === "dup") state.steps.splice(i + 1, 0, Object.assign({}, state.steps[i], { id: uid++ }));
    else if (a === "del") { state.steps.splice(i, 1); state.steps.forEach(s => { if (s.noTarget === id) s.noTarget = null; }); }
    else return;
    save(); render();
    const again = flow.querySelector(`.node[data-id="${id}"] button[data-a="${a}"]`); if (again) again.focus();
  });

  document.getElementById("chartTitle").addEventListener("input", e => { state.title = e.target.value; save(); });
  document.getElementById("addEnd").addEventListener("click", () => {
    const n = mk("step", "", "", 30, "min");
    const last = state.steps[state.steps.length - 1];
    if (last && last.type === "end") state.steps.splice(state.steps.length - 1, 0, n); else state.steps.push(n);
    save(); render(); focusSel(n.id, "name");
  });

  const toast = (msg, err) => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.toggle("err", !!err); clearTimeout(toast.h); toast.h = setTimeout(() => t.textContent = "", 4000); };

  // ---------- Fillable PDF export ----------
  let downloadsP = null;
  try { if (window.claude && claude.use) downloadsP = Promise.race([claude.use("downloads"), new Promise(r => setTimeout(() => r(null), 1500))]); } catch (e) {}

  // Standard PDF fonts only cover Latin-1; swap common symbols and drop the rest.
  const pdfSafe = s => String(s == null ? "" : s)
    .replace(/[→⇒]/g, "->").replace(/[←]/g, "<-").replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
    .replace(/[–—]/g, "-").replace(/…/g, "...").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, "");

  async function buildPdf(includeBlanks) {
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.create();
    doc.setTitle(pdfSafe(state.title) || "Flowchart");
    const font = await doc.embedFont(StandardFonts.Helvetica);
    const bold = await doc.embedFont(StandardFonts.HelveticaBold);
    const form = doc.getForm();
    const hex = h => rgb(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255);
    const C = { ink: hex("#18212b"), muted: hex("#5d6b7a"), line: hex("#c9d2db"), field: hex("#f4f6f8"),
      step: hex("#1f6feb"), start: hex("#1a7f5a"), decision: hex("#b7791f"), wait: hex("#7c5cc4"), end: hex("#b42318") };

    const steps = state.steps.map(s => Object.assign({}, s));
    if (includeBlanks) {
      const blanks = [0, 1, 2].map(() => ({ id: "b" + Math.random().toString(36).slice(2), type: "step", name: "", desc: "", dur: "", unit: "min" }));
      const endIdx = steps.length && steps[steps.length - 1].type === "end" ? steps.length - 1 : steps.length;
      steps.splice(endIdx, 0, ...blanks);
    }

    const W = 612, H = 792, M = 40, BX = 112, BW = W - M - BX, BH = 76, GAP = 22, PER = 6;
    const pages = Math.max(1, Math.ceil(steps.length / PER));
    const units = Object.keys(UNITS).map(k => UNIT_LABEL[k]);
    const typeNames = Object.values(TYPES);
    const fieldOpts = (x, y, w, h) => ({ x, y, width: w, height: h, borderWidth: 0.6, borderColor: C.line, backgroundColor: C.field, textColor: C.ink });
    const text = (pg, str, x, y, size, f, color) => pg.drawText(pdfSafe(str), { x, y, size, font: f || font, color: color || C.muted });

    let t = 0;
    const startTimes = steps.map(s => { const v = t; t += minutes(s); return v; });
    const total = fmt(t);

    for (let p = 0; p < pages; p++) {
      const page = doc.addPage([W, H]);
      let top = H - M;
      if (p === 0) {
        text(page, "FLOWCHART", M, top - 8, 8, bold);
        const tf = form.createTextField("chart_title");
        tf.setText(pdfSafe(state.title));
        tf.addToPage(page, fieldOpts(M, top - 40, 380, 26)); tf.setFontSize(15);
        text(page, "TOTAL TIME", 452, top - 8, 8, bold);
        const tot = form.createTextField("total_time");
        tot.setText(total);
        tot.addToPage(page, fieldOpts(452, top - 40, W - M - 452, 26)); tot.setFontSize(14);
        top -= 62;
        text(page, "Every box is a fillable field. 'Starts' and 'Total time' are filled from the template at export; update them if you change durations.", M, top, 7.5);
        top -= 18;
      } else {
        text(page, pdfSafe(state.title) + " (continued)", M, top - 10, 10, bold, C.ink);
        top -= 30;
      }

      const slice = steps.slice(p * PER, p * PER + PER);
      slice.forEach((s, k) => {
        const i = p * PER + k, n = i + 1, color = C[s.type] || C.step, bottom = top - BH;
        // Shape
        const r = s.type === "start" || s.type === "end" ? 22 : 6;
        let path;
        if (s.type === "decision") {
          const c = 14;
          path = `M ${c} 0 L ${BW - c} 0 L ${BW} ${BH / 2} L ${BW - c} ${BH} L ${c} ${BH} L 0 ${BH / 2} Z`;
        } else {
          path = `M ${r} 0 L ${BW - r} 0 Q ${BW} 0 ${BW} ${r} L ${BW} ${BH - r} Q ${BW} ${BH} ${BW - r} ${BH} L ${r} ${BH} Q 0 ${BH} 0 ${BH - r} L 0 ${r} Q 0 0 ${r} 0 Z`;
        }
        const shapeOpts = { x: BX, y: top, color: rgb(1, 1, 1), borderColor: color, borderWidth: 1.4 };
        if (s.type === "wait") shapeOpts.borderDashArray = [4, 3];
        page.drawSvgPath(path, shapeOpts);
        if (s.type === "step" || s.type === "wait") page.drawRectangle({ x: BX + 1, y: bottom + 6, width: 4, height: BH - 12, color });

        const L = BX + (s.type === "start" || s.type === "end" ? 20 : 16);
        // Type + number
        const typeF = form.createDropdown(`step${n}_type`);
        typeF.addOptions(typeNames); typeF.select(TYPES[s.type] || "Step");
        typeF.addToPage(page, Object.assign(fieldOpts(L, top - 19, 76, 13), { textColor: color })); typeF.setFontSize(7.5);
        text(page, "STEP " + String(n).padStart(2, "0"), L + 82, top - 15, 7, bold);
        // Name + notes
        const nameF = form.createTextField(`step${n}_name`);
        nameF.setText(pdfSafe(s.name));
        nameF.addToPage(page, fieldOpts(L, top - 41, 288, 18)); nameF.setFontSize(10.5);
        const notesF = form.createTextField(`step${n}_notes`);
        notesF.enableMultiline(); notesF.setText(pdfSafe(s.desc));
        notesF.addToPage(page, fieldOpts(L, top - 69, 288, 24)); notesF.setFontSize(8);
        // Duration
        const R = BX + BW - 150;
        text(page, "DURATION", R, top - 15, 7, bold);
        const durF = form.createTextField(`step${n}_duration`);
        durF.setText(s.dur === "" || s.dur == null ? "" : pdfSafe(s.dur));
        durF.addToPage(page, fieldOpts(R, top - 41, 62, 20)); durF.setFontSize(11);
        const unitF = form.createDropdown(`step${n}_unit`);
        unitF.addOptions(units); unitF.select(UNIT_LABEL[s.unit] || "min");
        unitF.addToPage(page, fieldOpts(R + 66, top - 41, 56, 20)); unitF.setFontSize(9);
        if (s.type === "decision") {
          const j = steps.findIndex(x => x.id === s.noTarget);
          text(page, "IF " + pdfSafe(s.no || "No").toUpperCase().slice(0, 12) + ", GO TO", R, top - 53, 6.5, bold);
          const brF = form.createTextField(`step${n}_branch`);
          brF.setText(j >= 0 ? "Step " + (j + 1) + ": " + pdfSafe(steps[j].name) : "");
          brF.addToPage(page, fieldOpts(R, top - 70, 122, 14)); brF.setFontSize(7.5);
        }
        // Start time (left gutter)
        text(page, "STARTS", M, top - 15, 7, bold);
        const stF = form.createTextField(`step${n}_starts`);
        stF.setText(String(s.id).startsWith("b") ? "" : "+" + fmt(startTimes[i]));
        stF.addToPage(page, fieldOpts(M, top - 38, BX - M - 10, 18)); stF.setFontSize(9);

        // Connector
        const last = i === steps.length - 1, pageEnd = k === slice.length - 1;
        if (!last) {
          const cx = BX + BW / 2;
          if (pageEnd) {
            text(page, "continued on next page", cx - 40, bottom - 14, 7.5);
          } else {
            page.drawLine({ start: { x: cx, y: bottom }, end: { x: cx, y: bottom - GAP + 6 }, thickness: 1.4, color: C.line });
            page.drawSvgPath("M -5 0 L 5 0 L 0 7 Z", { x: cx, y: bottom - GAP + 7, color: C.line });
            if (s.type === "decision") text(page, pdfSafe(s.yes || "Yes").toUpperCase(), cx + 8, bottom - 13, 7, bold, C.decision);
          }
        }
        top = bottom - GAP;
      });
      text(page, `Page ${p + 1} of ${pages}`, W - M - 50, 22, 7.5);
    }
    form.updateFieldAppearances(font);
    return doc.save();
  }

  document.getElementById("exportPdf").addEventListener("click", async e => {
    const btn = e.currentTarget;
    if (typeof PDFLib === "undefined") { toast("The PDF tool didn't load. Reload the page and try again.", true); return; }
    const downloads = downloadsP ? await downloadsP.catch(() => null) : null;
    // Outside claude.ai (e.g. GitHub Pages) fall back to a normal browser download.
    const plainSave = ({ filename, data }) => {
      const url = URL.createObjectURL(new Blob([data], { type: "application/pdf" }));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      return Promise.resolve({ status: "saved" });
    };
    const saver = downloads ? downloads.save : plainSave;
    btn.disabled = true; btn.textContent = "Building PDF…";
    try {
      const bytes = await buildPdf(document.getElementById("blankSlots").checked);
      const name = (pdfSafe(state.title).trim().replace(/[^\w\- ]+/g, "").replace(/\s+/g, "-") || "flowchart") + ".pdf";
      await saver({ filename: name, data: new Blob([bytes]) });
      toast("PDF saved");
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") toast("Export cancelled");
      else if (code === "rate_limited") toast("A save prompt is already open. Try again in a moment.", true);
      else if (code && code !== "bad_request") toast("Saving files isn't available here.", true);
      else { console.error(err); toast("Couldn't build the PDF: " + (err && err.message || err), true); }
    } finally { btn.disabled = false; btn.textContent = "Export fillable PDF"; }
  });
  document.getElementById("copyText").addEventListener("click", async () => {
    let t = 0;
    const lines = [state.title, "Total time: " + fmt(state.steps.reduce((a, s) => a + minutes(s), 0)), ""];
    state.steps.forEach((s, i) => {
      let line = `${i + 1}. [${TYPES[s.type]}] ${s.name || "Untitled"} (${s.dur || 0} ${UNIT_LABEL[s.unit]}; starts +${fmt(t)})`;
      if (s.desc) line += `\n   ${s.desc}`;
      if (s.type === "decision") { const j = find(s.noTarget); line += `\n   ${s.yes || "Yes"} → step ${i + 2}` + (j >= 0 ? `; ${s.no || "No"} → step ${j + 1}` : ""); }
      lines.push(line); t += minutes(s);
    });
    try { await navigator.clipboard.writeText(lines.join("\n")); toast("Copied to clipboard"); }
    catch (e) { toast("Copy was blocked by the browser"); }
  });

  const dlg = document.getElementById("dlg");
  document.getElementById("resetBtn").addEventListener("click", () => { dlg.classList.add("open"); document.getElementById("dlgNo").focus(); });
  document.getElementById("dlgNo").addEventListener("click", () => dlg.classList.remove("open"));
  document.getElementById("dlgYes").addEventListener("click", () => {
    try { localStorage.removeItem(KEY); } catch (e) {}
    uid = 1; state = load(); render(); dlg.classList.remove("open"); toast("Template restored");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") dlg.classList.remove("open"); });

  state = load();
  render();
})();
</script>
</body>
</html>
